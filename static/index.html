<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tally(a)wg</title>
<style>
  :root {
    --bg:#ffffff; --fg:#1b1b1b; --muted:#8a8a8a; --line:#ececec; --hover:#f7f7f7;
    --accent:#d32f2f; --bar-bg:#efefef; --on:#1aa251; --on-accent:#ffffff;
    --ctrl:#f1f1f1; --ctrl-fg:#555; --ctrl-bd:#dcdcdc;
  }
  html[data-theme="dark"] {
    --bg:#12161d; --fg:#e8e8e8; --muted:#7e8aa0; --line:#222c3a; --hover:#171e29;
    --accent:#ff6b6b; --bar-bg:#222c3a; --on:#3ddc84; --on-accent:#12161d;
    --ctrl:#1c2531; --ctrl-fg:#9fb0c8; --ctrl-bd:#2a3547;
  }
  * { box-sizing:border-box; }
  body { font-family:system-ui,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--fg);
         margin:0; padding:20px 24px; transition:background .15s,color .15s; }
  header { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .logo { font-size:24px; font-weight:700; letter-spacing:.3px; }
  .logo .suf { color:var(--accent); }
  .logo .ver { color:var(--muted); font-size:12px; font-weight:500; letter-spacing:0; margin-left:8px; vertical-align:middle; }
  .upd { margin-left:8px; font-size:12px; font-weight:500; letter-spacing:0; vertical-align:middle; color:var(--accent); }
  .upd button { border:1px solid var(--accent); background:transparent; color:var(--accent); font:inherit;
                cursor:pointer; border-radius:6px; padding:2px 9px; margin-right:6px; }
  .upd button:hover:not(:disabled) { background:var(--accent); color:var(--on-accent); }
  .upd button:disabled { opacity:.6; cursor:default; }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .field { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
  .step { display:inline-flex; align-items:stretch; border:1px solid var(--ctrl-bd); border-radius:7px;
          overflow:hidden; background:var(--ctrl); }
  .step input { width:46px; border:0; background:transparent; color:var(--fg); text-align:center;
                font:inherit; font-size:13px; padding:5px 4px; outline:0; }
  .arrows { display:flex; flex-direction:column; border-left:1px solid var(--ctrl-bd); }
  .arrows button { border:0; background:transparent; color:var(--ctrl-fg); cursor:pointer; line-height:1;
                   font-size:9px; padding:0 6px; height:50%; }
  .arrows button:hover { color:var(--fg); }
  .btn { border:0; background:var(--ctrl); color:var(--ctrl-fg); width:36px; height:32px;
         border-radius:8px; cursor:pointer; font-size:15px; line-height:1; }
  .meta { display:flex; justify-content:space-between; align-items:baseline; gap:14px;
          flex-wrap:wrap; color:var(--muted); font-size:13px; margin:14px 0; }
  .summary { display:flex; margin:14px 0 6px; border:1px solid var(--line); border-radius:12px;
             overflow:hidden; flex-wrap:wrap; }
  .summary[hidden] { display:none; } /* an author display beats the UA rule for [hidden] */
  .seg { flex:1 1 360px; display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer;
         transition:background .12s, opacity .2s; }
  .seg + .seg { border-left:1px solid var(--line); }
  .seg:hover { background:var(--hover); }
  .seg.info { cursor:default; }
  .seg.info:hover { background:transparent; }
  .seg.off { opacity:.4; }
  .seg.off:hover { opacity:1; }
  .seg .badge { flex:none; }
  .seg-meta { color:var(--muted); font-size:13px; white-space:nowrap; }
  .seg-meta .on { color:var(--on); }
  .seg-stats { margin-left:auto; display:flex; gap:20px; white-space:nowrap; font-size:13px; }
  .seg-stats .k { color:var(--muted); margin-right:5px; }
  .seg-stats b { font-variant-numeric:tabular-nums; font-weight:700; }
  .wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  th,td { text-align:left; padding:9px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  th[data-key] { cursor:pointer; user-select:none; }
  th[data-key]:hover { color:var(--fg); }
  .si { color:var(--accent); }
  td.num { font-variant-numeric:tabular-nums; }
  td.total { color:var(--accent); font-weight:700; }
  tr:hover td { background:var(--hover); }
  /* pin value/status columns so changing numbers never reflow the table */
  #tbl tr > :nth-child(3) { min-width:178px; }                          /* Peer           */
  #tbl tr > :nth-child(4) { min-width:150px; }                          /* Status         */
  #tbl tr > :nth-child(5), #tbl tr > :nth-child(6) { min-width:220px; } /* Session, Total */
  #tbl tr > :nth-child(9) { min-width:120px; }                          /* Year           */
  #tbl tr > :nth-child(10) { min-width:162px; }                         /* Month          */
  #tbl tr > :nth-child(11) { min-width:120px; }                         /* Today          */
  /* flash a cell when its value changes */
  @keyframes bump { 0% { background:color-mix(in srgb, var(--accent) 26%, transparent); } 100% { background:transparent; } }
  td.bump { animation:bump 1.1s ease-out; }
  .peer { font-weight:600; }
  .badge { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.3px; padding:2px 6px;
           border-radius:5px; vertical-align:middle; }
  .badge.awg { color:var(--accent); background:color-mix(in srgb, var(--accent) 15%, transparent); }
  .badge.wg  { color:var(--muted); background:var(--bar-bg); }
  .ip,.up { color:var(--muted); }
  .ep { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .stag { font-size:10px; text-transform:uppercase; letter-spacing:.3px; color:var(--muted); margin-bottom:2px; }
  .stag:empty { display:none; }
  /* actions */
  .actcol { width:44px; }
  #tbl.noadmin .actcol, #tbl.noadmin td.act { display:none; }
  td.act { text-align:left; width:44px; }
  /* anchor the menu to the button, not to the cell — rows are tall and it would drift away */
  .actwrap { position:relative; display:inline-block; }
  .dots { border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:16px; line-height:1;
          padding:2px 6px; border-radius:6px; opacity:0; transition:opacity .12s, color .12s; }
  tr:hover .dots, .dots.open, .dots:focus-visible { opacity:1; }
  .dots:hover { color:var(--fg); background:var(--hover); }
  @media (hover:none) { .dots, .addbtn { opacity:1; } } /* nothing hovers on a touch screen */
  /* fixed and parented to <body>: the scrolling table would otherwise clip it on the last rows */
  .menu { position:fixed; z-index:20; min-width:170px; padding:4px;
          background:var(--bg); border:1px solid var(--line); border-radius:9px;
          box-shadow:0 8px 24px rgba(0,0,0,.18); text-align:left; }
  /* caret pointing back at the ⋯ that opened it; --caret is the button's centre */
  .menu:before, .menu:after { content:""; position:absolute; left:calc(var(--caret) - 7px); border:7px solid transparent; }
  .menu:before { bottom:100%; border-bottom-color:var(--line); }
  .menu:after { bottom:100%; border-bottom-color:var(--bg); margin-bottom:-1px; }
  .menu.up:before { bottom:auto; top:100%; border-bottom-color:transparent; border-top-color:var(--line); }
  .menu.up:after { bottom:auto; top:100%; border-bottom-color:transparent; border-top-color:var(--bg); margin:-1px 0 0; }
  html[data-theme="dark"] .menu { box-shadow:0 8px 24px rgba(0,0,0,.6); }
  .menu button { display:block; width:100%; text-align:left; border:0; background:transparent; color:var(--fg);
                 font:inherit; font-size:13px; padding:7px 10px; border-radius:6px; cursor:pointer; white-space:nowrap; }
  .menu button:hover { background:var(--hover); }
  .menu button.danger { color:var(--accent); }
  /* add-peer row: one line plus the bar below it, exactly what fills every other row */
  tr.addrow td { color:var(--muted); box-sizing:content-box; height:calc(1lh + 10px); }
  tr.addrow .badge { cursor:pointer; }
  tr.addrow .badge:hover { outline:1px solid var(--accent); }
  .newname { border:1px solid var(--ctrl-bd); background:var(--ctrl); color:var(--fg); font:inherit;
             font-size:13px; padding:3px 8px; border-radius:6px; width:136px; outline:0;
             transition:border-color .12s; }
  .newname::placeholder { color:var(--muted); }
  .newname:hover { border-color:var(--muted); }
  .newname:focus, .step:focus-within { border-color:var(--accent); }
  .addhint { color:var(--muted); font-size:12px; }
  .addbtn { border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:17px;
            line-height:1; padding:2px 7px; border-radius:6px; opacity:0; transition:opacity .12s, color .12s; }
  tr.addrow:hover .addbtn, .addbtn:focus-visible { opacity:1; }
  .addbtn:hover { color:var(--accent); background:var(--hover); }
  .bar { height:5px; border-radius:3px; background:var(--bar-bg); margin-top:5px; overflow:hidden; min-width:90px; }
  .bar>span { display:block; height:100%; background:var(--accent); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; background:var(--muted); }
  .dot.on { background:var(--on); }
  .st-on { color:var(--on); font-weight:600; }
  .mnav { display:inline-flex; gap:1px; margin-right:7px; vertical-align:middle; }
  .mnav button { border:0; background:transparent; color:var(--fg); cursor:pointer; font-size:12px;
                 line-height:1; padding:1px 3px; border-radius:4px; }
  .mnav button:hover:not(:disabled) { color:var(--accent); background:var(--hover); }
  .mnav button:disabled { color:var(--muted); cursor:default; }
  .empty { color:var(--muted); padding:20px 0; }
  footer { margin-top:20px; color:var(--muted); font-size:12px; line-height:1.85; }
  footer .legrow { display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  footer b { color:var(--fg); font-weight:600; }
</style>
</head>
<body>
  <header>
    <div class="logo">tally<span class="suf" id="suf">(a)wg</span><span class="ver" id="ver"></span><span class="upd" id="upd" hidden></span></div>
    <div class="controls">
      <span class="field">UTC
        <span class="step">
          <input id="tzin" inputmode="numeric" value="+0" title="hours offset from UTC">
          <span class="arrows"><button id="tzup" type="button" title="UTC offset up">&#9650;</button><button id="tzdn" type="button" title="UTC offset down">&#9660;</button></span>
        </span>
      </span>
      <button class="btn" id="themebtn" title="toggle theme">&#9789;</button>
    </div>
  </header>

  <div class="meta">
    <span id="metaleft">loading&hellip;</span>
    <span id="metaright"></span>
  </div>

  <div class="summary" id="summary" hidden></div>

  <div class="wrap">
    <table id="tbl" hidden>
      <thead><tr>
        <th class="actcol"></th>
        <th data-key="proto">Proto<span class="si"></span></th>
        <th data-key="peer">Peer<span class="si"></span></th>
        <th data-key="status">Status<span class="si"></span></th>
        <th data-key="session">Session<span class="si"></span></th>
        <th data-key="total">Total<span class="si"></span></th>
        <th data-key="ip">Address<span class="si"></span></th>
        <th data-key="endpoint">Endpoint<span class="si"></span></th>
        <th data-key="year">Year <span id="ysel"></span><span class="si"></span></th>
        <th data-key="month">
          <span class="mnav"><button id="mdn" type="button" title="older">&#9660;</button><button id="mup" type="button" title="newer">&#9650;</button></span>
          Month <span id="msel"></span><span class="si"></span></th>
        <th data-key="today">Today<span class="si"></span></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="empty" id="empty" hidden>No data yet &mdash; the collector runs on a timer; check back shortly.</div>

  <footer id="legend" hidden></footer>

<script>
const $ = id => document.getElementById(id);
let tzVal = Math.max(-12, Math.min(14, parseInt(localStorage.getItem("tally-tzoff") || "0", 10) || 0));
let theme = localStorage.getItem("tally-theme") || "light";
let sortKey = localStorage.getItem("tally-sortkey") || "total";
let sortDir = localStorage.getItem("tally-sortdir") || "desc";
let view = localStorage.getItem("tally-view") || "all";
let selMonth = "", lastData = null;
let prevVals = {}, prevMonth = "";
const strCols = { peer: 1, endpoint: 1, ip: 1, proto: 1 };

function applyTheme() {
  document.documentElement.dataset.theme = theme;
  $("themebtn").innerHTML = theme === "dark" ? "&#9728;" : "&#9789;";
}
function renderTz() { $("tzin").value = (tzVal >= 0 ? "+" : "") + tzVal; }
const fmt = n => {
  let f = Number(n);
  for (const u of ["B","KiB","MiB","GiB","TiB"]) { if (f < 1024) return f.toFixed(1)+" "+u; f /= 1024; }
  return f.toFixed(1)+" PiB";
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const shifted = unix => new Date((unix + tzVal * 3600) * 1000);
const hhmm = d => String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0");
const sameDay = (a, b) => a.getUTCFullYear() === b.getUTCFullYear() && a.getUTCMonth() === b.getUTCMonth() && a.getUTCDate() === b.getUTCDate();
// day label: "today" for the current day, else month and day — plus the year once it differs
function day(d) {
  const now = shifted(Date.now() / 1000);
  if (sameDay(d, now)) return "today";
  const md = MON[d.getUTCMonth()] + " " + d.getUTCDate();
  return d.getUTCFullYear() === now.getUTCFullYear() ? md : md + " " + d.getUTCFullYear();
}
function sessTag(p) {
  if (!p.session_start || !p.handshake_at) return "";
  const a = shifted(p.session_start);
  if (p.online) return `since ${day(a)} ${hhmm(a)}`;
  if (p.handshake_at <= p.session_start) return `${day(a)} ${hhmm(a)}`;
  const b = shifted(p.handshake_at);
  return sameDay(a, b)
    ? `${day(a)} ${hhmm(a)} → ${hhmm(b)}`
    : `${day(a)} ${hhmm(a)} → ${day(b)} ${hhmm(b)}`;
}
// padded octets make a string compare order IPv4 numerically; IPv6 falls back to text
const ipKey = ip => {
  const s = String(ip || ""), p = s.split(".");
  return p.length === 4 && p.every(o => o !== "" && Number.isInteger(+o))
    ? p.map(o => String(+o).padStart(3, "0")).join(".")
    : s;
};
const sortVal = {
  peer: p => p.peer.toLowerCase(),
  status: p => p.online ? 1 : 0,
  session: p => p.session_down + p.session_up,
  total: p => p.down_total + p.up_total,
  ip: p => ipKey(p.ip),
  endpoint: p => p.endpoint || "",
  today: p => p.down_today + p.up_today,
  month: p => p.down_month + p.up_month,
  year: p => p.down_year + p.up_year,
  proto: p => p.kind === "awg" ? 0 : 1,
};

let reqSeq = 0;
async function load() {
  const seq = ++reqSeq; // the timer and a month/tz click can be in flight together
  try {
    const q = new URLSearchParams({ tz: String(tzVal), month: selMonth });
    const res = await fetch("api/usage?" + q, { cache: "no-store" });
    if (!res.ok) throw new Error(`server said ${res.status}: ${(await res.text()).slice(0, 200)}`);
    const data = await res.json();
    if (seq !== reqSeq) return; // a newer request already answered, this one is stale
    lastData = data;
    render();
  } catch (e) {
    if (seq === reqSeq) $("metaleft").textContent = "error: " + e.message;
  }
}

function agg(list) {
  let t = 0, y = 0, td = 0, mo = 0;
  for (const p of list) {
    t += p.down_total + p.up_total;
    y += p.down_year + p.up_year;
    td += p.down_today + p.up_today;
    mo += p.down_month + p.up_month;
  }
  return { t, y, td, mo };
}
function segHtml(v, list, clickable) {
  const on = list.filter(p => p.online).length, a = agg(list);
  const onEl = on > 0 ? `<span class="on">${on} online</span>` : `${on} online`;
  return `<div class="seg${clickable ? "" : " info"}"${clickable ? ` data-view="${v}" tabindex="0" role="button"` : ""}>
    <span class="badge ${v}">${v === "awg" ? "AWG" : "WG"}</span>
    <span class="seg-meta">${list.length} peers &middot; ${onEl}</span>
    <span class="seg-stats">
      <span><span class="k">total</span><b>${fmt(a.t)}</b></span>
      <span><span class="k">year</span><b>${fmt(a.y)}</b></span>
      <span><span class="k">month</span><b>${fmt(a.mo)}</b></span>
      <span><span class="k">today</span><b>${fmt(a.td)}</b></span>
    </span></div>`;
}

function render() {
  const d = lastData; if (!d) return;
  const all = (d.peers || []).slice();
  const awgP = all.filter(p => p.kind === "awg"), wgP = all.filter(p => p.kind !== "awg");
  const multi = awgP.length > 0 && wgP.length > 0;
  if (!multi) view = "all";
  else if (view !== "all" && view !== "awg" && view !== "wg") view = "all";

  const sumEl = $("summary");
  if (multi) {
    sumEl.hidden = false;
    sumEl.innerHTML = segHtml("awg", awgP, true) + segHtml("wg", wgP, true);
  } else if (all.length) {
    sumEl.hidden = false;
    sumEl.innerHTML = awgP.length ? segHtml("awg", awgP, false) : segHtml("wg", wgP, false);
  } else {
    sumEl.hidden = true;
    sumEl.innerHTML = "";
  }
  renderView();
}

function renderView() {
  const d = lastData; if (!d) return;
  const all = (d.peers || []).slice();
  const awgP = all.filter(p => p.kind === "awg"), wgP = all.filter(p => p.kind !== "awg");
  document.querySelectorAll("#summary .seg[data-view]").forEach(s =>
    s.classList.toggle("off", view !== "all" && s.dataset.view !== view));

  let peers = (view === "awg" ? awgP : view === "wg" ? wgP : all).slice();
  const f = Object.hasOwn(sortVal, sortKey) ? sortVal[sortKey] : sortVal.total, dir = sortDir === "asc" ? 1 : -1;
  peers.sort((a, b) => { const x = f(a), y = f(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });

  const online = peers.filter(p => p.online).length;
  $("suf").textContent = d.backend || "(a)wg";
  $("ver").textContent = d.version ? "v" + d.version : "";
  $("metaleft").textContent = `${peers.length} peer(s), ${online} online`;
  $("metaright").textContent = `updated ${d.now}`;
  $("msel").textContent = d.month;
  $("ysel").textContent = (d.month || "").slice(0, 4);

  const months = monthList(d), mi = months.indexOf(d.month);
  $("mdn").disabled = mi <= 0;
  $("mup").disabled = mi >= months.length - 1;

  const max = Math.max(1, ...peers.map(p => p.down_total + p.up_total));
  const prev = prevVals, cur = {}, sameMonth = prevMonth === d.month;
  // the 5-minute refresh rebuilds every row, so carry a half-typed peer name across it
  const typing = (() => {
    const i = $("newname");
    return i && !i.hidden ? { value: i.value, focused: document.activeElement === i } : null;
  })();
  const tb = $("rows"); tb.innerHTML = "";
  for (const p of peers) {
    const tot = p.down_total + p.up_total;
    const sess = p.session_down + p.session_up;
    const tday = p.down_today + p.up_today;
    const mon = p.down_month + p.up_month;
    const yr = p.down_year + p.up_year;
    const pk = p.pubkey || p.peer;
    cur[pk] = { sess, tot, tday, mon, yr };
    const pv = prev[pk]; // flash only on a real change
    const bSess = pv && pv.sess !== sess ? " bump" : "";
    const bTot  = pv && pv.tot  !== tot  ? " bump" : "";
    const bTday = pv && pv.tday !== tday ? " bump" : "";
    const bMon  = pv && sameMonth && pv.mon !== mon ? " bump" : ""; // not on month switch
    const bYr   = pv && sameMonth && pv.yr  !== yr  ? " bump" : "";
    const badge = `<span class="badge ${p.kind === "awg" ? "awg" : "wg"}">${p.kind === "awg" ? "AWG" : "WG"}</span>`;
    const status = p.online
      ? `<span class="dot on"></span><span class="st-on">online</span>`
      : `<span class="dot"></span>${esc(p.handshake || "never")}`;
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td class="act"><span class="actwrap"><button type="button" class="dots" title="Actions" data-pub="${esc(pk)}" data-name="${esc(p.peer)}">⋯</button></span></td>
       <td>${badge}</td>
       <td><div class="peer">${esc(p.peer)}</div><div class="bar"><span style="width:${(tot/max*100).toFixed(1)}%"></span></div></td>
       <td>${status}</td>
       <td class="num${bSess}"><div class="stag">${sessTag(p)}</div>${fmt(p.session_down)} ↓ <span class="up">/ ${fmt(p.session_up)} ↑</span></td>
       <td class="num total${bTot}">${fmt(p.down_total)} ↓ <span class="up">/ ${fmt(p.up_total)} ↑</span></td>
       <td class="ip">${esc(p.ip || "—")}</td>
       <td class="ep">${esc(p.endpoint || "—")}</td>
       <td class="num${bYr}">${fmt(yr)}</td>
       <td class="num${bMon}">${fmt(mon)}</td>
       <td class="num${bTday}">${fmt(tday)}</td>`;
    tb.appendChild(tr);
  }
  // the column goes away, but its cells stay so the column-width pins keep lining up
  $("tbl").classList.toggle("noadmin", !adminReady);
  if (adminReady) {
    tb.appendChild(addRow());
    if (typing) {
      editAdd(true);
      const i = $("newname");
      i.value = typing.value;
      if (typing.focused) i.focus();
    }
  }
  prevVals = { ...prevVals, ...cur }; // keep peers hidden by the current filter, so their next change still flashes
  prevMonth = d.month;
  // with no peers yet the add row is the only way to make one, so the table has to stay
  $("tbl").hidden = peers.length === 0 && !adminReady;
  $("empty").hidden = peers.length !== 0 || adminReady;

  document.querySelectorAll("th .si").forEach(s => s.textContent = "");
  const ath = document.querySelector(`th[data-key="${sortKey}"] .si`);
  if (ath) ath.textContent = sortDir === "asc" ? " ▲" : " ▼";
  document.querySelectorAll("th[data-key]").forEach(th =>
    th.setAttribute("aria-sort", th.dataset.key !== sortKey ? "none" : sortDir === "asc" ? "ascending" : "descending"));

  $("legend").innerHTML =
    `<div class="legrow"><span><b>↓ down</b> = peer downloaded (server→peer)</span>` +
      `<span>times in <b>${esc(d.tz)}</b>, auto-refresh 5m</span></div>` +
    `<div><b>↑ up</b> = peer uploaded (peer→server)</div>` +
    `<div><b>●</b> online = handshake &lt; 3 min</div>`;
  $("legend").hidden = false;
}

function setTz(v) { tzVal = Math.max(-12, Math.min(14, v)); localStorage.setItem("tally-tzoff", String(tzVal)); renderTz(); load(); }
function sortBy(k) { if (k === sortKey) sortDir = sortDir === "asc" ? "desc" : "asc"; else { sortKey = k; sortDir = strCols[k] ? "asc" : "desc"; } localStorage.setItem("tally-sortkey", sortKey); localStorage.setItem("tally-sortdir", sortDir); renderView(); }
// the months holding data, plus the shown one — which has no traffic yet on the 1st of a month
function monthList(d) {
  const out = ((d && d.months) || []).slice();
  if (d && d.month && !out.includes(d.month)) out.push(d.month);
  return out.sort();
}

// steps through that list, so it crosses year boundaries
function navMonth(step) {
  const months = monthList(lastData);
  const i = months.indexOf(selMonth || (lastData && lastData.month) || "") + step;
  if (i < 0 || i >= months.length) return;
  selMonth = months[i];
  load();
}

$("themebtn").onclick = () => { theme = theme === "dark" ? "light" : "dark"; localStorage.setItem("tally-theme", theme); applyTheme(); };
$("tzup").onclick = () => setTz(tzVal + 1);
$("tzdn").onclick = () => setTz(tzVal - 1);
// take the leading whole hours only, so "5.5" or "+05:30" land on 5 instead of being read as 55 / 530
$("tzin").onchange = () => { const m = String($("tzin").value).trim().match(/^([+-]?\d{1,2})/); setTz(m ? parseInt(m[1], 10) : 0); };
$("tzin").onkeydown = e => { if (e.key === "ArrowUp") { e.preventDefault(); setTz(tzVal + 1); } else if (e.key === "ArrowDown") { e.preventDefault(); setTz(tzVal - 1); } };
$("mdn").onclick = e => { e.stopPropagation(); navMonth(-1); };
$("mup").onclick = e => { e.stopPropagation(); navMonth(1); };
$("summary").addEventListener("click", e => { const s = e.target.closest(".seg[data-view]"); if (!s) return; const v = s.dataset.view; view = view === v ? "all" : v; localStorage.setItem("tally-view", view); renderView(); });
// sorting and the proto filter live on th/div, so they need the keyboard part of a button
const activates = e => (e.key === "Enter" || e.key === " ") && !e.target.closest("button");
$("summary").addEventListener("keydown", e => {
  const s = e.target.closest(".seg[data-view]");
  if (!s || !activates(e)) return;
  e.preventDefault();
  s.click();
});
document.querySelectorAll("th[data-key]").forEach(th => {
  th.tabIndex = 0; // no role="button": that would cost the header its column semantics
  th.addEventListener("click", () => sortBy(th.dataset.key));
  th.addEventListener("keydown", e => { // the month header also holds the ◀▶ buttons
    if (!activates(e)) return;
    e.preventDefault();
    sortBy(th.dataset.key);
  });
});

// update banner: checked once per page load; the server caches the GitHub lookup for an hour
async function checkUpdate() {
  try {
    const d = await (await fetch("api/update", { cache: "no-store" })).json();
    if (!d.available) return;
    showUpdate(d.latest);
  } catch (e) { /* offline or GitHub is unreachable — the banner just stays hidden */ }
}

// ---- peer actions --------------------------------------------------------
let newKind = localStorage.getItem("tally-newkind") || "awg";

function addRow() {
  const tr = document.createElement("tr");
  tr.className = "addrow";
  tr.innerHTML =
    `<td class="act"><button type="button" class="addbtn" id="addbtn" title="Add a peer">+</button></td>
     <td><span class="badge ${newKind}" id="newproto" title="Click to switch between AWG and WG">${newKind === "awg" ? "AWG" : "WG"}</span></td>
     <td><input class="newname" id="newname" placeholder="new peer name" autocomplete="off" size="1" hidden></td>
     <td colspan="8"><span class="addhint" id="newhint" hidden>Press Enter to create, Esc to cancel</span></td>`;
  tr.querySelector("#newproto").onclick = () => {
    newKind = newKind === "awg" ? "wg" : "awg";
    localStorage.setItem("tally-newkind", newKind);
    renderView();
  };
  tr.querySelector("#addbtn").onclick = () => {
    editAdd(true);
    $("newname").focus();
  };
  const input = tr.querySelector("#newname");
  // only Enter creates: a blur fires on any stray click, including the proto badge beside it
  input.onkeydown = e => { if (e.key === "Enter") createPeer(input.value); };
  return tr;
}

// closing always clears, so a reload cannot restore a name that was already created
function editAdd(on) {
  const i = $("newname");
  if (!i) return; // no add row at all when this device may not change anything
  i.hidden = !on;
  $("newhint").hidden = !on;
  if (!on) i.value = "";
}

let creating = false;
async function createPeer(name) {
  name = name.trim();
  if (!name || creating) return;
  creating = true;
  try {
    const res = await fetch("api/peers", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, kind: newKind }),
    });
    if (!res.ok) throw new Error((await res.text()).trim() || res.status);
    editAdd(false); // done with it — on a failure it stays open so the name can be fixed
    await load();
  } catch (e) {
    alert("could not add the peer: " + e.message);
  } finally { creating = false; }
}

function closeMenus() {
  const opener = document.querySelector(".dots.open");
  document.querySelectorAll(".menu").forEach(m => m.remove());
  document.querySelectorAll(".dots.open").forEach(d => d.classList.remove("open"));
  // removing the menu drops focus on <body>; hand it back rather than losing the user's place
  if (opener && document.activeElement === document.body) opener.focus();
}

function openMenu(btn) {
  const pub = btn.dataset.pub, name = btn.dataset.name;
  closeMenus();
  btn.classList.add("open");
  const m = document.createElement("div");
  m.className = "menu";
  document.body.appendChild(m);
  menuActions(m, pub, name);
  placeMenu(m, btn);
  m.querySelector("button").focus(); // the menu sits at the end of <body>, so tabbing to it would cross the page
}

// pin the menu to the button in viewport coordinates, flipping above it when the page ends
function placeMenu(m, btn) {
  const b = btn.getBoundingClientRect(), box = m.getBoundingClientRect(), gap = 6;
  let left = b.left;
  if (left + box.width > innerWidth - 8) left = innerWidth - box.width - 8;
  const below = b.bottom + gap, flip = below + box.height > innerHeight - 8 && b.top - gap - box.height > 8;
  m.classList.toggle("up", flip);
  m.style.left = Math.max(8, left) + "px";
  m.style.top = (flip ? b.top - gap - box.height : below) + "px";
  m.style.setProperty("--caret", (b.left + b.width / 2 - Math.max(8, left)) + "px");
}

function menuActions(m, pub, name) {
  m.innerHTML =
    `<button type="button" data-do="config">Download config</button>
     <button type="button" data-do="qr">Show QR code</button>
     <button type="button" class="danger" data-do="delete">Delete peer…</button>`;
  m.onclick = e => {
    const act = e.target.closest("button")?.dataset.do;
    if (!act) return;
    closeMenus();
    if (act === "delete") deletePeer(pub, name);
    else openPeerFile(pub, name, act);
  };
}


async function authedBlob(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error((await res.text()).trim() || res.status);
  return res.blob();
}

async function openPeerFile(pub, name, what) {
  try {
    const blob = await authedBlob(`api/peers/${encodeURIComponent(pub)}/${what}`);
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    if (what === "qr") {
      // the token prompt can outlive the click's user activation, and a blocked tab is silent
      if (!window.open(url, "_blank")) {
        const a = document.createElement("a");
        a.href = url; a.download = name + ".png"; a.click();
      }
    } else {
      const a = document.createElement("a");
      a.href = url; a.download = name + ".conf"; a.click();
    }
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  } catch (e) { alert("could not fetch it: " + e.message); }
}

async function deletePeer(pub, name) {
  if (!confirm(`Delete "${name}" and its history for good?`)) return;
  try {
    const res = await fetch("api/peers/" + encodeURIComponent(pub), { method: "DELETE" });
    if (!res.ok && res.status !== 204) throw new Error((await res.text()).trim() || res.status);
    await load();
  } catch (e) { alert("could not delete it: " + e.message); }
}

// the server decides from the request address, so there is nothing to hold here
let adminReady = false;

async function applyUpdate() {
  const btn = $("updbtn");
  btn.disabled = true;
  btn.textContent = "Updating…";
  try {
    const res = await fetch("api/update", { method: "POST" });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(d.error || res.status);
    $("upd").textContent = `installed ${d.installed}, restarting…`;
    setTimeout(() => location.reload(), 6000); // give the service time to come back up
  } catch (e) {
    showUpdate(latestTag, "failed: " + e.message); // keep the button so it can be retried
  }
}

let latestTag = "";
function showUpdate(tag, note) {
  if (!adminReady) return; // installing it needs a token, so don't offer what can't be done
  latestTag = tag;
  const el = $("upd");
  el.innerHTML = `<button type="button" id="updbtn">Update</button> ${esc(note || tag + " available")}`;
  el.hidden = false;
  $("updbtn").onclick = applyUpdate;
}

document.addEventListener("click", e => {
  const dots = e.target.closest(".dots");
  if (dots) { dots.classList.contains("open") ? closeMenus() : openMenu(dots); return; }
  if (!e.target.closest(".menu")) closeMenus();
});
// on the document, so Escape closes them from anywhere, not only while they hold focus
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeMenus(); editAdd(false); } });
// the menu is pinned to viewport coordinates, so it must not linger once things move
addEventListener("scroll", closeMenus, true);
addEventListener("resize", closeMenus);

async function checkAdmin() {
  try {
    const d = await (await fetch("api/admin", { cache: "no-store" })).json();
    adminReady = !!d.admin;
  } catch (e) { adminReady = false; }
}

renderTz(); applyTheme();
// know whether the actions column and the update button belong before drawing either
checkAdmin().finally(() => { load(); checkUpdate(); });
setInterval(load, 300000); // 5 min, matches the collector
</script>
</body>
</html>
